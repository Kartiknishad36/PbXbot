services:
  - type: worker
    name: pbxbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash PBX
    envVars:
      - key: APP_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: PBXBOT_SESSION
        sync: false
      - key: OWNER_ID
        sync: false
      - key: HANDLER
        value: "."
